<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Visitenkarte – OneDrive Version</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  OneDrive-optimierte Version:
  - Lädt alle Dateien relativ (OneDrive-kompatibel)
  - QR-Code zeigt auf deinen echten OneDrive-Link
  - Automatische Profil-Erkennung über ?email=
  - Dropdown-Fallback
  - Leere Variablen werden ausgeblendet
-->

<style>
  body { font-family: Helvetica, Arial, sans-serif; background:#fff; margin:40px; color:#000; }
  hr { border:none; border-top:1px solid #000; margin:20px 0; }
  .gruss { font-size:22px; margin-bottom:10px; }
  .name-top { font-size:22px; font-weight:bold; }
  .container { display:flex; align-items:flex-start; gap:20px; margin-top:20px; }
  .left { flex:1; }
  .right { width:200px; min-width:200px; }
  .block { border-left:2px solid #000; padding-left:20px; }
  .name { font-weight:bold; letter-spacing:4px; font-size:18px; margin-bottom:6px; }
  .role { font-size:14px; margin-bottom:12px; }
  .line { margin:4px 0; font-size:14px; }
  a { color:#0078d4; text-decoration:none; }
  a:hover { text-decoration:underline; }
  #qrcode img { width:200px; height:200px; }

  @media (max-width: 700px) {
    body { margin:20px; }
    .container { flex-direction:column; align-items:flex-start; }
    .right { width:100%; min-width:0; margin-top:20px; display:flex; justify-content:center; }
    #qrcode img { width:160px; height:160px; }
  }

  @media (max-width: 450px) {
    .name { letter-spacing:2px; font-size:16px; }
    .gruss, .name-top { font-size:18px; }
    #qrcode img { width:140px; height:140px; }
  }
</style>
</head>

<body>

<div class="gruss">
  Mit freundlichen Grüssen<br>
  <span class="name-top" id="topname"></span>
</div>

<hr>

<select id="profilSelector" style="margin-bottom:20px;">
  <option value="">Profil auswählen…</option>
  <option value="emchberger">Emch+Berger</option>
  <option value="privat">Privat</option>
  <option value="projekt">Projekt</option>
</select>

<div class="container">
  <div class="left block">
    <div class="name" id="name"></div>
    <div class="role" id="role"></div>

    <div class="line" id="tel"></div>
    <div class="line" id="email"></div>
    <div class="line" id="adr"></div>
    <div class="line" id="url"></div>

    <div class="line">
      <a id="vcardlink" href="#" download="visitenkarte.vcf">vCard herunterladen</a>
    </div>
  </div>

  <div class="right" id="qrcode"></div>
</div>

<script>
// Dein echter OneDrive-Link:
const onedriveLink = "https://1drv.ms/f/c/c2d999972b73110c/IgC2OZzPsmhNQ6hFR1wNM6RWAXHHrj-5cdVPaBME7E5ONG8?e=vOOO4j";

// Email aus URL lesen
const params = new URLSearchParams(window.location.search);
const email = params.get("email");

// Profil-Mapping laden
fetch("profiles.json")
  .then(r => r.json())
  .then(map => {
    let profil = map[email] || map["default"];

    document.getElementById("profilSelector").addEventListener("change", e => {
      if (e.target.value) loadProfile(e.target.value);
    });

    loadProfile(profil);
  });

// Profil laden
function loadProfile(profil) {
  fetch(profil + ".txt")
    .then(r => r.text())
    .then(t => {
      const d = {};
      t.split("\n").forEach(l => {
        const [k,v] = l.split("=");
        if(k) d[k.trim()] = (v || "").trim();
      });

      const show = (id, value, link=false) => {
        if(!value) { document.getElementById(id).style.display="none"; return; }
        if(link) {
          document.getElementById(id).innerHTML = `<a href="${value}" target="_blank">${value}</a>`;
        } else {
          document.getElementById(id).textContent = value;
        }
      };

      show("topname", d.NAME);
      show("name", d.NAME);
      show("role", `${d.PREFIX || ""} ${d.SUFFIX || ""}`.trim());

      if(d.TEL_MOBILE || d.TEL) {
        document.getElementById("tel").innerHTML =
          `<a href="tel:${d.TEL_MOBILE || d.TEL}">${d.TEL_MOBILE || d.TEL}</a>`;
      } else {
        document.getElementById("tel").style.display="none";
      }

      if(d.EMAIL) {
        document.getElementById("email").innerHTML =
          `<a href="mailto:${d.EMAIL}">${d.EMAIL}</a>`;
      } else {
        document.getElementById("email").style.display="none";
      }

      show("adr", d.ADR);
      show("url", d.URL, true);

      // vCard erzeugen
      const vcf = `BEGIN:VCARD
VERSION:3.0
FN:${d.NAME || ""}
ORG:${d.ORG || ""}
TITLE:${d.TITLE || ""}
TEL;WORK:${d.TEL_MOBILE || d.TEL || ""}
EMAIL:${d.EMAIL || ""}
ADR:${d.ADR || ""}
URL:${d.URL || ""}
END:VCARD`;

      const blob = new Blob([vcf], {type:"text/vcard"});
      document.getElementById("vcardlink").href = URL.createObjectURL(blob);

      // QR-Code für OneDrive-Link
      const qr = document.createElement("img");
      qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
               encodeURIComponent(onedriveLink);
      document.getElementById("qrcode").innerHTML = "";
      document.getElementById("qrcode").appendChild(qr);
    });
}
</script>

</body>
</html>
